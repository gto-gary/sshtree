[project]
name = "sshtui"
version = "0.1.0"
description = "TUI for browsing, connecting to, and editing SSH config hosts"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "sshconf>=0.2.7",
]

[project.scripts]
sshtui = "sshtui.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sshtui*"]
