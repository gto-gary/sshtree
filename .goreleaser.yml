version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sshtree
    main: ./cmd/sshtree
    binary: sshtree
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gto-gary/sshtree/internal/ui.Version={{.Version}}

# The binary is fully self-contained: shell integration (the "recall the
# real ssh/sftp/scp command with the up arrow" behavior) is baked in via
# `sshtree --shell-init zsh|bash`, not a separate file to bundle here.
archives:
  - id: sshtree
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  disable: true # flip to false (or run `goreleaser release`) when actually cutting a GitHub/GitLab release
