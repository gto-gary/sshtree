version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sshtui
    main: ./cmd/sshtui
    binary: sshtui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X gitlab.com/gto_gary/sshtui/go/internal/ui.Version={{.Version}}

archives:
  - id: sshtui
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  disable: true # flip to false (or run `goreleaser release`) when actually cutting a GitHub/GitLab release
