stages:
  - build

.build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv sync --group dev
    - uv run pyinstaller sshtui.spec
    - mv dist/sshtui "dist/${BINARY_NAME}"
  artifacts:
    paths:
      - dist/${BINARY_NAME}

build:linux:
  extends: .build
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  tags:
    - saas-linux-small-amd64
  variables:
    BINARY_NAME: sshtui-linux

build:macos:
  extends: .build
  tags:
    - saas-macos-medium-m1
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  variables:
    BINARY_NAME: sshtui-macos
