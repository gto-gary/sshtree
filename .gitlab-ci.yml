stages:
  - build
  - release

build:linux:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv sync --group dev
    - uv run pyinstaller sshtui.spec
    - mv dist/sshtui dist/sshtui-linux
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file dist/sshtui-linux \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sshtui/${CI_COMMIT_TAG}/sshtui-linux"
  artifacts:
    paths:
      - dist/sshtui-linux

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:linux
  script:
    - echo "Publishing release ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    description: "sshtui ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: sshtui-linux
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sshtui/${CI_COMMIT_TAG}/sshtui-linux"
