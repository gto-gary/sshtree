stages:
  - build

build:linux:
  stage: build
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  tags:
    - saas-linux-small-amd64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - uv sync --group dev
    - uv run pyinstaller sshtui.spec
    - mv dist/sshtui dist/sshtui-linux
  artifacts:
    paths:
      - dist/sshtui-linux
